[project]
name = "python-testing-dependencies"
version = "0.1.0"
description = "A sample Python project with outdated dependencies for testing purposes."
authors = [
    { name = "Aditya", email = "aditya@example.com" }
]
dependencies = [
    "flask==2.0.1",
    "requests==2.25.1",
